<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flamebeat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gpu"></canvas>
  <canvas id="debug" hidden></canvas>
  <div id="routes" hidden></div>
  <div id="render" hidden></div>
  <div id="msg" hidden></div>
  <div id="hud"></div>
  <div id="bar">
    <audio id="audio" controls preload="auto"></audio>
    <label class="btn">open… <input id="file" type="file" accept="audio/*,.json,application/json" multiple hidden></label>
    <button id="routes-btn" class="btn" type="button">routes</button>
    <button id="render-btn" class="btn" type="button">render video</button>
    <label class="fade" title="trail fade time (double-click = 0.15 s)">fade <input id="fade" type="range" min="0" max="1" step="0.005"> <output id="fade-val"></output></label>
    <label class="fade" title="zoom: how big the fractal is on screen (double-click = 1×)">zoom <input id="zoom" type="range" min="-1" max="1" step="0.005"> <output id="zoom-val"></output></label>
    <span id="status"></span>
    <span class="keys">space play · ←/→ seek · P preset · D debug · M routes · V video · [ ] iterations · H hide</span>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
